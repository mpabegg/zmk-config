manifest:
  defaults:
    revision: v0.3 # ZMK release; modules are pinned to their matching release
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-tri-state
      remote: urob
    - name: zmk-rgbled-widget
      remote: caksoylar
  self:
    path: config
