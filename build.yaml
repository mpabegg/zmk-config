# This file generates the GitHub Actions matrix.
# Forager: left half is the central (no dongle).
---
include:
  - board: seeeduino_xiao_ble
    shield: forager_central_left rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: forager_left

  - board: seeeduino_xiao_ble
    shield: forager_peripheral_right rgbled_adapter
    artifact-name: forager_right

  - board: nice_nano_v2
    shield: chocofi_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: chocofi_left

  - board: nice_nano_v2
    shield: chocofi_right
    artifact-name: chocofi_right

  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: xiao_settings_reset

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nano_settings_reset
